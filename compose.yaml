# LabShop: API + PostgreSQL + web frontend.
#   cp .env.example .env
#   docker compose up --build
services:
  api:
    build: .
    image: labshop-api:dev
    env_file: .env
    environment:
      DB_HOST: localhost
      DB_PORT: "5432"
    ports:
      - "8081:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgres/data

  web:
    build: ./web
    image: labshop-web:dev
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  db-data:
